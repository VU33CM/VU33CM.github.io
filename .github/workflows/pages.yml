name: Deploy HAM Corner

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  build:

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Add Analytics to all HTML pages
        run: |
          echo "Adding analytics.js..."

          for file in *.html; do
            echo "Checking $file"

            if ! grep -q "js/analytics.js" "$file"; then
              sed -i 's#</body>#<script src="js/analytics.js"></script>\n</body>#' "$file"
              echo "Analytics added to $file"
            else
              echo "Analytics already exists in $file"
            fi
          done

          echo "===== Analytics check ====="
          grep -n "analytics.js" *.html || true

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
