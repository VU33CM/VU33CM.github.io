name: Deploy HAM Corner

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Add Analytics to all HTML pages
        run: |
          echo "Adding analytics.js to HTML pages..."

          for file in *.html; do
            if ! grep -q 'js/analytics.js' "$file"; then
              sed -i 's#</body>#<script src="js/analytics.js"></script>\n</body>#' "$file"
              echo "Added analytics to $file"
            else
              echo "Already present in $file"
            fi
          done

          echo ""
          echo "===== VERIFYING HTML FILES ====="

          for file in *.html; do
            if grep -q 'js/analytics.js' "$file"; then
              echo "OK: $file"
            else
              echo "ERROR: $file"
              exit 1
            fi
          done

          echo ""
          echo "===== VERIFYING ANALYTICS FILE ====="

          test -f js/analytics.js
          echo "OK: js/analytics.js exists"

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
